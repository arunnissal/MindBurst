name: Build MindBurst Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies for Android compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ffmpeg ccache patch libmpc-dev libmpfr-dev libgmp-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libunwind-dev \
            zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev libffi-dev \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libgl1-mesa-dev libstdc++6 \
            autoconf libtool pkg-config zip unzip openjdk-17-jdk

      - name: Install Buildozer & Cython 0.29
        run: |
          python -m pip install --upgrade "pip<24.0" setuptools wheel
          pip install --upgrade "buildozer>=1.5.0" "Cython==0.29.33" virtualenv

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer bin

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -v android debug || {
            echo "================================ BUILDOZER FAILURE LOG ================================"
            find .buildozer -name "*.log" -exec echo "--- LOG: {} ---" \; -exec tail -n 150 {} \; 2>/dev/null || true
            exit 1
          }

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindBurst-1.0.0-arm64-debug.apk
          path: bin/*.apk
          retention-days: 30
